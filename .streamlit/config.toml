[theme]
primaryColor = "#0F52BA"          # Màu chủ đạo (Xanh Sapphire)
backgroundColor = "#FFFFFF"       # Màu nền chính
secondaryBackgroundColor = "#F0F2F6" # Màu nền của Sidebar
textColor = "#262730"             # Màu chữ
font = "sans serif"

[server]
headless = true
enableCORS = false

[client]
showErrorDetails = true